<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maison d'hôtes (démo) | Devanture</title>
<!-- Démo fictive des exemples Devanture : pas indexée ; chambres, prix et disponibilités inventés ; aucune réservation réelle. -->
<meta name="robots" content="noindex, follow">
<meta name="theme-color" content="#EEF2EC">
<link rel="icon" href="../../favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Young+Serif&amp;family=Figtree:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
:root{--bg:#EEF2EC;--card:#FFFFFF;--ink:#1E2A22;--muted:#5C6B60;--line:#D8E0D5;--green:#3F6B4F;--green-2:#325740;--sun:#E9B44C}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Figtree,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer}
.serif{font-family:"Young Serif",Georgia,serif;font-weight:400}
.wrap{width:min(1140px,100% - 40px);margin-inline:auto}
.top{display:flex;align-items:center;justify-content:space-between;height:72px}
.brand{display:flex;align-items:center;gap:10px;font-size:22px}
.brand i{width:36px;height:36px;border-radius:10px;background:var(--green);display:grid;place-items:center}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--card)}
.lang button{border:0;background:none;padding:6px 11px;border-radius:999px;font-size:12px;font-weight:700}
.lang button[aria-pressed="true"]{background:var(--ink);color:#fff}
.hero{position:relative;border-radius:30px;overflow:hidden;min-height:420px;display:flex;align-items:flex-end;background:#CFE1D2}
.hero svg.paysage{position:absolute;inset:0;width:100%;height:100%}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(248,241,224,.92) 0%,rgba(248,241,224,.75) 38%,rgba(248,241,224,0) 62%)}
.hero .txt{position:relative;z-index:1;padding:40px;max-width:640px}
.kicker{font-size:12.5px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--green)}
.hero h1{font-size:clamp(40px,5.4vw,68px);line-height:1.02;margin:12px 0 14px}
.hero p{font-size:18px;line-height:1.55;margin:0;color:#2E3D33;max-width:46ch}
.layout{display:grid;grid-template-columns:1.25fr .75fr;gap:28px;padding:40px 0 80px;align-items:start}
h2{font-size:34px;margin:0 0 18px}
.rooms{display:flex;flex-direction:column;gap:14px;margin-bottom:34px}
.room{display:grid;grid-template-columns:96px 1fr auto;gap:18px;align-items:center;padding:16px;border-radius:20px;background:var(--card);border:2px solid transparent;text-align:left;width:100%}
.room[aria-pressed="true"]{border-color:var(--green)}
.room .pic{width:96px;height:80px;border-radius:14px;display:grid;place-items:center}
.room b{display:block;font-size:18px;margin-bottom:4px}
.room small{color:var(--muted);font-size:14px}
.room .pr{font-family:"Young Serif",Georgia,serif;font-size:22px;text-align:right}
.room .pr small{display:block;font-family:Figtree,sans-serif;font-size:12px}
.cal{background:var(--card);border-radius:22px;padding:22px}
.cal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.cal-head b{font-size:18px;text-transform:capitalize}
.cal-head button{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:none}
.grid7{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.grid7 .dow{font-size:12px;color:var(--muted);padding:6px 0}
.day{height:44px;border-radius:12px;border:0;background:none;font-size:14px}
.day:hover:not(:disabled){background:var(--bg)}
.day:disabled{color:#B6C0B8;text-decoration:line-through;cursor:not-allowed}
.day.in{background:#DCE9DF;border-radius:0}
.day.edge{background:var(--green);color:#fff;border-radius:12px}
.legend{display:flex;gap:16px;margin-top:14px;font-size:12.5px;color:var(--muted)}
.side{position:sticky;top:20px;background:var(--card);border-radius:24px;padding:24px;display:flex;flex-direction:column;gap:16px;border:1px solid var(--line)}
.side h3{margin:0;font-size:24px}
.guests{display:flex;justify-content:space-between;align-items:center}
.guests div{display:flex;align-items:center;gap:10px}
.guests button{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:none;font-size:18px}
.lines{display:flex;flex-direction:column;gap:8px;padding-top:14px;border-top:1px solid var(--line);font-size:15px;color:var(--muted)}
.lines div{display:flex;justify-content:space-between}
.tot{display:flex;justify-content:space-between;align-items:baseline;padding-top:14px;border-top:1px solid var(--line)}
.tot b{font-family:"Young Serif",Georgia,serif;font-size:30px}
.go{min-height:54px;border-radius:999px;border:0;background:var(--green);color:#fff;font-weight:700;font-size:16px}
.go:hover{background:var(--green-2)}
.go:disabled{opacity:.5;cursor:not-allowed}
.hint{font-size:13px;color:var(--muted);margin:0}
footer{padding:0 0 50px;text-align:center;color:var(--muted);font-size:13px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;background:var(--ink);color:#fff;padding:14px 18px;border-radius:14px;font-size:14px;transition:.25s ease;max-width:92%;text-align:center;z-index:9}
.toast.on{opacity:1;transform:translateX(-50%)}
@media (max-width:900px){.layout{grid-template-columns:1fr}.side{position:static}}
@media (max-width:560px){.room{grid-template-columns:64px 1fr}.room .pic{width:64px;height:60px}.room .pr{grid-column:2;text-align:left}.hero .txt{padding:26px}}
/* menu commun et sous-pages */
:root{--dn-hover:rgba(30,42,34,.06);--dn-panel:#FFFFFF;--dn-panel-text:#1E2A22;--dn-hover-panel:#EEF2EC;--dn-accent:#3F6B4F;--dn-line:#D8E0D5;--dn-text:#1E2A22;--dn-muted:#5C6B60;--dn-card:#FFFFFF;--dn-top:72px}
#reserver{scroll-margin-top:20px}
.room .dn-photo{width:96px;height:80px;border-radius:14px}
@media (max-width:560px){.room .dn-photo{width:64px;height:60px}}
html,body{overflow-x:clip}
@media (max-width:560px){.brand .b2{display:none}.brand{font-size:20px}}
