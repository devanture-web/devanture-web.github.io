<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carte de restaurant (démo) | Devanture</title>
<!-- Démo fictive montrée dans les exemples de Devanture : pas indexée, contenu inventé (restaurant, plats, prix). -->
<meta name="robots" content="noindex, follow">
<meta name="theme-color" content="#17120D">
<link rel="icon" href="../../favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&amp;family=Manrope:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
:root{--bg:#17120D;--card:#2A2018;--line:#4A3D2E;--line-2:#3A2E22;--cream:#F4EBDD;--muted:#C9BBA5;--amber:#E0A43A;--terra:#C8643C;--ink:#1A140E}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--cream);font-family:Manrope,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer}
.app{max-width:460px;margin:0 auto;padding:18px 18px 26px;min-height:100vh;display:flex;flex-direction:column;gap:18px}
.serif{font-family:Fraunces,Georgia,serif;font-weight:600;letter-spacing:-.02em}
.kicker{font-size:11.5px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--amber)}
.mark{display:grid;place-items:center;background:var(--amber);border-radius:18px}
.mark svg{stroke:var(--ink)}
svg{flex:none}
.screen{display:none;flex-direction:column;gap:18px;animation:entre .28s ease}
.screen.on{display:flex}
@keyframes entre{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.top{display:flex;align-items:center;justify-content:space-between;min-height:44px}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px}
.lang button{border:0;background:none;font-size:12px;font-weight:700;padding:7px 12px;border-radius:999px;color:var(--muted)}
.lang button[aria-pressed="true"]{background:var(--amber);color:var(--ink)}
.back{display:flex;align-items:center;gap:8px;min-height:44px;background:none;border:0;padding:0;font-weight:600;font-size:14px}
.hero{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;padding:4px 0}
.hero .mark{width:64px;height:64px}
.hero h1{margin:0;font-size:44px;line-height:1}
.today{display:flex;align-items:center;gap:14px;padding:16px 18px;border-radius:18px;background:var(--card);border:1px solid #5A4631;text-align:left;width:100%}
.today .ico{width:46px;height:46px;border-radius:14px;background:var(--terra);display:grid;place-items:center}
.today .txt{flex:1;display:flex;flex-direction:column;gap:2px}
.today .dish{font-size:19px}
.today small{font-size:13px;color:var(--muted)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{display:flex;flex-direction:column;justify-content:space-between;gap:14px;padding:18px;min-height:118px;border-radius:18px;background:var(--card);border:1px solid var(--line);text-align:left;transition:transform .15s ease,border-color .15s ease}
.tile:hover,.today:hover{border-color:var(--amber)}
.tile:active{transform:scale(.98)}
.tile.light{background:var(--cream);color:var(--ink);border-color:var(--cream)}
.tile span{font-size:22px}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;min-height:56px;border-radius:999px;background:var(--amber);color:var(--ink);font-weight:700;font-size:16px;border:0;width:100%}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ghost{display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;border-radius:999px;border:1px solid #5A4631;font-weight:600;font-size:14px;background:none}
.hours{margin-top:auto;padding-top:16px;border-top:1px solid var(--line-2);text-align:center;font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.hours b{color:var(--cream)}
h2.title{margin:0;font-size:40px;line-height:1.02}
.formules{border:1px solid var(--line);border-radius:20px;overflow:hidden}
.formules .row{display:flex;align-items:center;gap:12px;padding:18px 20px;border-bottom:1px solid var(--line-2)}
.formules .row:last-child{border-bottom:0;background:var(--card)}
.formules .row div{flex:1;display:flex;flex-direction:column;gap:3px}
.formules b{font-size:16px}
.formules small{font-size:13px;color:var(--muted)}
.price{font-family:Fraunces,Georgia,serif;font-weight:600;font-size:22px;color:var(--amber);white-space:nowrap}
.dujour{display:flex;flex-direction:column;gap:14px;padding:26px 22px;border-radius:22px;background:var(--cream);color:var(--ink);text-align:center}
.dujour .tag{align-self:center;font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;padding:6px 12px;border-radius:999px;background:var(--ink);color:var(--cream)}
.dujour .name{font-size:30px;line-height:1.1}
.dujour p{margin:0;font-size:15px;line-height:1.5;color:#4A3B2C}
.dujour small{font-size:12px;font-weight:600;color:#7A6650}
.choice{display:flex;flex-direction:column;gap:6px;padding:18px;border-radius:18px;background:var(--card);border:1px solid var(--line);text-align:left}
.choice span:first-child{font-size:20px;color:var(--amber)}
.choice small{font-size:13px;color:var(--muted)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{min-height:44px;padding:0 18px;border-radius:999px;border:1px solid #5A4631;background:none;font-size:14px;font-weight:600}
.chip[aria-pressed="true"]{background:var(--amber);border-color:var(--amber);color:var(--ink);font-weight:700}
.tabs{position:sticky;top:0;z-index:2;display:flex;background:var(--bg);border-bottom:1px solid var(--line-2);margin:0 -18px;padding:0 18px}
.tabs a{flex:1;text-align:center;padding:14px 0;font-size:14px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent}
.tabs a.cur{color:var(--cream);border-bottom-color:var(--amber)}
.section{scroll-margin-top:60px}
.section h3{margin:8px 0 4px;font-size:28px;color:var(--amber)}
.item{display:flex;flex-direction:column;gap:6px;padding:14px 0;border-bottom:1px dashed var(--line-2)}
.item .l{display:flex;align-items:baseline;gap:12px}
.item .l b{flex:1;font-size:16px}
.item .l .price{font-size:18px}
.item p{margin:0;font-size:14px;line-height:1.45;color:var(--muted)}
.badges{display:flex;gap:6px}
.badges span{font-size:11px;font-weight:700;padding:4px 9px;border-radius:999px}
.b-v{background:#2F3A22;color:#C7DDA0}
.b-sg{background:#3A2E22;color:#F0C987}
.note{padding:12px 14px;border-radius:12px;background:#221A13;text-align:center;font-size:12px;color:var(--muted)}
.demo{text-align:center;font-size:11px;color:#8C7C66}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;background:var(--cream);color:var(--ink);font-size:13px;font-weight:600;padding:12px 16px;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.5);transition:.25s ease;max-width:90%;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%)}
.ph-slot{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;aspect-ratio:16/9;border-radius:18px;border:1.5px dashed rgba(244,235,221,.25);background:linear-gradient(135deg,rgba(244,235,221,.04),rgba(244,235,221,.09));color:rgba(244,235,221,.65);font-size:13px;text-align:center}
.ph-slot small{font-size:10px;letter-spacing:.16em;text-transform:uppercase;opacity:.8}
.ph-slot.small{aspect-ratio:16/8;border-color:rgba(26,20,14,.2);background:linear-gradient(135deg,rgba(26,20,14,.04),rgba(26,20,14,.08));color:rgba(26,20,14,.55)}
.burger{width:44px;height:44px;border-radius:12px;border:0;background:var(--amber);display:grid;place-items:center;cursor:pointer}
.drawer{position:fixed;inset:0;z-index:20;background:rgba(10,7,5,.55);opacity:0;pointer-events:none;transition:opacity .2s ease}
.drawer.on{opacity:1;pointer-events:auto}
.drawer-in{position:absolute;left:0;top:0;bottom:0;width:min(340px,86%);background:#1F1812;border-right:1px solid var(--line);padding:18px;display:flex;flex-direction:column;gap:10px;transform:translateX(-100%);transition:transform .25s cubic-bezier(.22,1,.36,1);overflow:auto}
.drawer.on .drawer-in{transform:none}
.d-head{display:flex;align-items:center;justify-content:space-between;padding-bottom:10px;border-bottom:1px solid var(--line-2)}
.d-close{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:none;font-size:22px}
.grp{border-bottom:1px solid var(--line-2)}
.grp>button,.grp>a{width:100%;display:flex;align-items:center;justify-content:space-between;min-height:54px;border:0;background:none;font-family:Fraunces,Georgia,serif;font-size:21px;font-weight:600;text-align:left;cursor:pointer;padding:0}
.grp>button svg{transition:transform .2s ease}
.grp.open>button svg{transform:rotate(180deg)}
.sub{display:none;padding:0 0 12px 4px}
.grp.open .sub{display:block}
.sub button{display:block;width:100%;text-align:left;border:0;background:none;padding:11px 12px;border-radius:10px;font-size:15px;color:var(--muted);cursor:pointer}
.sub button:hover{background:var(--card);color:var(--cream)}
.sub button small{display:block;font-size:12px;opacity:.75}
@media (prefers-reduced-motion:reduce){.screen{animation:none}.toast{transition:none}}
</style>
</head>
<body>
<div class="app">

  <!-- ===== Accueil (ce qu'on voit en scannant le QR code sur la table) ===== -->
  <section class="screen on" id="accueil" aria-labelledby="t-accueil">
    <div class="top">
      <button type="button" class="burger" data-menu aria-label="Menu" aria-expanded="false"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1A140E" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <div class="lang" role="group" aria-label="Langue / Language">
        <button type="button" data-lang="fr" aria-pressed="true">FR</button>

    <div class="hero">

      <span class="kicker" data-t="tagline"></span>
    </div>

    <button type="button" class="today" data-go="formules">
      <span class="ico"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFF6EA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v3M5.6 5.6l2.1 2.1M3 12h3M18 12h3M16.3 7.7l2.1-2.1"/><path d="M5 18a7 7 0 0 1 14 0"/><path d="M3 21h18"/></svg></span>
      <span class="txt"><span class="kicker" data-t="today_k"></span><span class="serif dish" data-t="dish"></span><small data-t="from"></small></span>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#E0A43A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </button>
    <div class="tiles">
      <button type="button" class="tile light" data-go="carte"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#1A140E" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h11a3 3 0 0 1 3 3v13H7a3 3 0 0 1-3-3V4Z"/><path d="M8 8h6M8 12h6M8 16h3"/></svg><span class="serif" data-t="t_carte"></span></button>
      <button type="button" class="tile" data-go="formules"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#E0A43A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg><span class="serif" data-t="t_formules"></span></button>
      <button type="button" class="tile" data-go="boissons" data-anchor="vins"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#E0A43A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12l-1.5 16a2 2 0 0 1-2 2h-5a2 2 0 0 1-2-2L6 3Z"/><path d="M6.5 8h11"/></svg><span class="serif" data-t="t_boissons"></span></button>
      <button type="button" class="tile" data-go="boissons" data-anchor="cocktails"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#E0A43A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16l-8 9-8-9Z"/><path d="M12 13v7M8 20h8"/><path d="M15 7l3-4"/></svg><span class="serif" data-t="t_cocktails"></span></button>
    </div>
    <button type="button" class="btn" data-toast="toast_book"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1A140E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4M9 15l2 2 4-4"/></svg><span data-t="book"></span></button>
    <div class="pair">
      <button type="button" class="ghost" data-toast="toast_review"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#E0A43A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9L12 3Z"/></svg><span data-t="review"></span></button>
      <button type="button" class="ghost" data-toast="toast_insta"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#E0A43A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/></svg>Instagram</button>
    </div>
    <div class="hours"><b data-t="days"></b><span data-t="hours"></span></div>
    <p class="demo" data-t="demo"></p>
  </section>

  <!-- ===== Formules et plat du jour ===== -->
  <section class="screen" id="formules" aria-labelledby="t-formules">
    <div class="top">
      <button type="button" class="back" data-go="accueil"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#E0A43A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg><span data-t="home"></span></button>
      <button type="button" class="burger" data-menu aria-label="Menu" aria-expanded="false"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1A140E" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    </div>
    <div><span class="kicker" data-t="lunch"></span><h2 class="serif title" id="t-formules" data-t="t_formules_long"></h2></div>
    <div class="formules">
      <div class="row"><div><b data-t="f1"></b></div><span class="price">16 €</span></div>
      <div class="row"><div><b data-t="f2"></b><small data-t="f2b"></small></div><span class="price">20 €</span></div>
      <div class="row"><div><b data-t="f3"></b></div><span class="price">25 €</span></div>
    </div>
    <div class="dujour">
      <div class="ph-slot small" role="img"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1Z"/><circle cx="12" cy="13" r="3.5"/></svg><small data-t="ph_k"></small><span data-t="ph_plat"></span></div>
      <span class="tag" data-t="dujour_tag"></span>
      <span class="serif name" data-t="dish"></span>
      <p data-t="dish_desc"></p>
      <small data-t="updated"></small>
    </div>
    <div class="pair">
      <button type="button" class="choice" data-go="carte" data-anchor="entrees"><span class="serif" data-t="starter"></span><small data-t="starter_b"></small></button>
      <button type="button" class="choice" data-go="carte" data-anchor="desserts"><span class="serif" data-t="dessert"></span><small data-t="dessert_b"></small></button>
    </div>
    <button type="button" class="btn" data-go="carte"><span data-t="see_all"></span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1A140E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
    <p class="note" data-t="allergens"></p>
  </section>

  <!-- ===== La carte, avec filtres ===== -->
  <section class="screen" id="carte" aria-labelledby="t-carte">
    <div class="top">
      <button type="button" class="back" data-go="accueil"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#E0A43A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg><span data-t="home"></span></button>
      <button type="button" class="burger" data-menu aria-label="Menu" aria-expanded="false"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1A140E" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    </div>
    <div><span class="kicker">Devanture · brasserie</span><h2 class="serif title" id="t-carte" data-t="t_carte"></h2></div>
    <div class="chips" role="group" id="chips"></div>
    <nav class="tabs" id="tabs"></nav>
    <div id="menu"></div>
    <p class="note" data-t="allergens"></p>
  </section>
  <section class="screen" id="boissons" aria-labelledby="t-boissons">
    <div class="top">
      <button type="button" class="back" data-go="accueil"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#E0A43A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg><span data-t="home"></span></button>
      <button type="button" class="burger" data-menu aria-label="Menu" aria-expanded="false"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1A140E" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>

    <div><span class="kicker">Devanture · bar</span><h2 class="serif title" id="t-boissons" data-t="t_boissons"></h2></div>

</div>

</div>

<script>

  var lang = "fr", filtre = "tout", timer = null;

    var t = T[lang];

    document.querySelectorAll("[data-t]").forEach(function (el) { el.textContent = t[el.getAttribute("data-t")]; });

    var t = T[lang];
    $("#tabsB").innerHTML = t.boissons.map(function (s) { return '<a href="#' + s.id + '" data-tab="' + s.id + '">' + esc(s.t) + "</a>"; }).join("");
    $("#menuB").innerHTML = t.boissons.map(function (s) {
      return '<div class="section" id="' + s.id + '"><h3 class="serif">' + esc(s.t) + "</h3>" + s.items.map(function (i) {

      }).join("") + "</div>";
    }).join("");
  }

  var CHEV = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#E0A43A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>';
  function tiroir() {
    var t = T[lang];
    $("#drawerNav").innerHTML = t.menu.map(function (m, i) {
      if (Array.isArray(m[1])) {
        return '<div class="grp"><button type="button" data-grp aria-expanded="false">' + esc(m[0]) + CHEV + '</button><div class="sub">' + m[1].map(function (x) {
          return '<button type="button" data-go="' + x[1] + '" data-anchor="' + x[2] + '" data-close>' + esc(x[0]) + "</button>";
        }).join("") + "</div></div>";
      }
      return '<div class="grp"><a href="#" ' + (m[1].indexOf("toast_") === 0 ? 'data-toast="' + m[1] + '"' : 'data-go="' + m[1] + '"') + " data-close>" + esc(m[0]) + "</a></div>";
    }).join("");
  }
  function ouvrirTiroir(o) {
    $("#drawer").classList.toggle("on", o);
    $("#drawer").setAttribute("aria-hidden", String(!o));
    document.querySelectorAll("[data-menu]").forEach(function (b) { b.setAttribute("aria-expanded", String(o)); });
  }

  function carte() {
    var t = T[lang];
    var chips = [["tout", t.all], ["v", t.veg], ["sg", t.gf]];
    $("#chips").setAttribute("aria-label", t.show);
    $("#chips").innerHTML = chips.map(function (c) {
      return '<button type="button" class="chip" data-f="' + c[0] + '" aria-pressed="' + (filtre === c[0]) + '">' + esc(c[1]) + "</button>";
    }).join("");
    $("#tabs").innerHTML = t.sections.map(function (s) { return '<a href="#' + s.id + '" data-tab="' + s.id + '">' + esc(s.t) + "</a>"; }).join("");
    $("#menu").innerHTML = t.sections.map(function (s) {
      var items = s.items.filter(function (i) { return filtre === "tout" || (filtre === "v" && i[3]) || (filtre === "sg" && i[4]); });
      return '<div class="section" id="' + s.id + '"><h3 class="serif">' + esc(s.t) + "</h3>" + items.map(function (i) {
        var b = (i[3] ? '<span class="b-v">' + esc(t.veg) + "</span>" : "") + (i[4] ? '<span class="b-sg">' + esc(t.gf) + "</span>" : "");
        return '<div class="item"><div class="l"><b>' + esc(i[0]) + '</b><span class="price">' + esc(i[2]) + "</span></div><p>" + esc(i[1]) + "</p>" + (b ? '<div class="badges">' + b + "</div>" : "") + "</div>";
      }).join("") + "</div>";
    }).join("");
  }

  function aller(ecran, ancre) {
    document.querySelectorAll(".screen").forEach(function (s) { s.classList.toggle("on", s.id === ecran); });
    if (ancre) {
      var cible = document.getElementById(ancre);
      if (cible) { cible.scrollIntoView({ block: "start" }); return; }
    }
    window.scrollTo(0, 0);
  }

  function toast(cle) {
    var el = $("#toast");
    el.textContent = T[lang][cle];
    el.classList.add("on");
    clearTimeout(timer);
    timer = setTimeout(function () { el.classList.remove("on"); }, 3200);
  }

  document.addEventListener("click", function (e) {
    if (e.target.closest("[data-menu]")) { ouvrirTiroir(true); return; }
