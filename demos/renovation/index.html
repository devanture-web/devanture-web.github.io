<title>Artisan rénovation (démo) | Devanture</title>
<!-- Démo fictive des exemples Devanture : pas indexée ; entreprise, chantiers et fourchettes de prix inventés. -->
<meta name="robots" content="noindex, follow">
<meta name="theme-color" content="#F4F1EA">
<link rel="icon" href="../../favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{--bg:#F4F1EA;--card:#FFFFFF;--ink:#1B1D1F;--muted:#5F6368;--line:#DDD7CB;--accent:#D9572B;--accent-2:#B94620;--sage:#5E7D6A}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Inter Tight",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button,select,input{font:inherit;color:inherit}
.disp{font-family:Archivo,system-ui,sans-serif;font-weight:800;letter-spacing:-.025em}
.wrap{width:min(1160px,100% - 40px);margin-inline:auto}
header{display:flex;align-items:center;justify-content:space-between;height:72px}
.brand{display:flex;align-items:center;gap:10px;font-family:Archivo,sans-serif;font-weight:800;font-size:21px}
.brand i{width:36px;height:36px;border-radius:9px;background:var(--accent);display:grid;place-items:center}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--card)}
.lang button{border:0;background:none;padding:6px 11px;border-radius:999px;font-size:12px;font-weight:600;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--ink);color:#fff}
.hero{display:grid;grid-template-columns:.9fr 1.1fr;gap:44px;align-items:center;padding:30px 0 60px}
.kicker{font-size:12.5px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--accent)}
h1{font-size:clamp(40px,5.2vw,66px);line-height:1;margin:14px 0 18px}
.lead{font-size:18px;line-height:1.55;color:var(--muted);margin:0 0 26px;max-width:44ch}
.btn{display:inline-flex;align-items:center;gap:10px;min-height:52px;padding:0 24px;border-radius:12px;border:0;background:var(--accent);color:#fff;font-weight:600;cursor:pointer}
.btn:hover{background:var(--accent-2)}
/* avant / après */
.ba{position:relative;border-radius:20px;overflow:hidden;aspect-ratio:8/5;box-shadow:0 30px 60px -30px rgba(0,0,0,.45);user-select:none;touch-action:pan-y}
.ba svg{position:absolute;inset:0;width:100%;height:100%}
.ba .apres{clip-path:inset(0 0 0 var(--pos,50%))}
.ba .poignee{position:absolute;top:0;bottom:0;left:var(--pos,50%);width:3px;margin-left:-1.5px;background:#fff;pointer-events:none}
.ba .poignee::after{content:"⇆";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:46px;height:46px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:20px;color:var(--ink);box-shadow:0 6px 20px rgba(0,0,0,.3)}
.ba .tag{position:absolute;top:14px;padding:6px 12px;border-radius:999px;font-size:12px;font-weight:600;background:rgba(27,29,31,.75);color:#fff;pointer-events:none}
.ba .tag.l{left:14px}.ba .tag.r{right:14px;background:var(--accent)}
.ba input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:ew-resize;margin:0}
section.part{padding:70px 0}
h2{font-size:clamp(30px,3.6vw,44px);margin:10px 0 12px}
.intro{color:var(--muted);font-size:17px;margin:0 0 34px;max-width:56ch;line-height:1.55}
/* estimateur */
.estim{display:grid;grid-template-columns:1.1fr .9fr;gap:24px;align-items:stretch}
.panel{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:28px;display:flex;flex-direction:column;gap:22px}
.panel h3{margin:0;font-size:15px;font-weight:600;color:var(--muted)}
.types{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.types button{display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 8px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);font-size:14px;font-weight:600;cursor:pointer}
.types button svg{width:28px;height:28px;color:var(--accent)}
.types button[aria-pressed="true"]{border-color:var(--accent);background:#FBE9E2}
.range{display:flex;align-items:center;gap:16px}
.range input{flex:1;accent-color:var(--accent);height:30px}
.range b{min-width:80px;text-align:right;font-family:Archivo,sans-serif;font-size:22px}
.seg{display:flex;border:1.5px solid var(--line);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;min-height:44px;border:0;border-radius:10px;background:none;font-weight:600;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
.result{background:var(--ink);color:#fff;border-radius:22px;padding:30px;display:flex;flex-direction:column;gap:14px}
.result small{color:#B7BCC2;font-size:14px}
.result .prix{font-family:Archivo,sans-serif;font-weight:800;font-size:clamp(34px,4vw,48px);line-height:1.05}
.result ul{list-style:none;padding:0;margin:6px 0;display:flex;flex-direction:column;gap:8px;font-size:15px;color:#DDE1E5}
.result li::before{content:"✓";color:#F2A184;margin-right:10px}
.result .btn{margin-top:auto;justify-content:center}
.note{font-size:12.5px;color:#9AA0A6}
/* réalisations */
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
.chip{min-height:42px;padding:0 16px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);font-weight:600;font-size:14px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.gal{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.real{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.real .vis{aspect-ratio:4/3}
.real .vis svg{width:100%;height:100%;display:block}
.real div.t{padding:16px 18px}
.real b{display:block;font-size:17px;margin-bottom:4px}
.real small{color:var(--muted);font-size:13.5px}
footer{padding:20px 0 50px;text-align:center;color:var(--muted);font-size:13px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;background:var(--ink);color:#fff;padding:14px 18px;border-radius:14px;font-size:14px;transition:.25s ease;max-width:92%;text-align:center;z-index:9}
.toast.on{opacity:1;transform:translateX(-50%)}
@media (max-width:940px){.hero,.estim{grid-template-columns:1fr}.gal{grid-template-columns:1fr 1fr}}
@media (max-width:600px){.types{grid-template-columns:1fr 1fr}.gal{grid-template-columns:1fr}}
/* menu commun et sous-pages */
:root{--dn-hover:rgba(27,29,31,.06);--dn-panel:#FFFFFF;--dn-panel-text:#1B1D1F;--dn-hover-panel:#F4F1EA;--dn-accent:#D9572B;--dn-line:#DDD7CB;--dn-text:#1B1D1F;--dn-muted:#5F6368;--dn-card:#FFFFFF;--dn-top:72px;--dn-radius:12px}
#estimer,#realisations{scroll-margin-top:20px}
.real .dn-photo{height:100%;border-radius:0;border-width:0 0 1.5px}
html,body{overflow-x:clip}

<script>
(function () {
  "use strict";
  var nav = null;
  /* fourchettes par m², INVENTÉES pour la démo */
  var TYPES = [
    { id: "cuisine", ico: '<path d="M4 10h16v10H4zM4 14h16M9 10V6h6v4"/>', min: 700, max: 1300 },
    { id: "sdb", ico: '<path d="M4 12h16v3a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5v-3ZM6 12V6a2 2 0 0 1 4 0"/>', min: 900, max: 1600 },
    { id: "peinture", ico: '<path d="M4 4h13v5H4zM17 6h3v6h-8v3M12 15v5"/>', min: 25, max: 45 },
    { id: "sol", ico: '<path d="M3 20h18M3 16h18M7 16v4M13 16v4M19 16v4M5 12l7-7 7 7"/>', min: 45, max: 95 }
  ];
  var REAL = [
    { cat: "cuisine", c1: "#3F5B4C", c2: "#C9A77E" }, { cat: "sdb", c1: "#7FA7B8", c2: "#EDEAE3" }, { cat: "peinture", c1: "#D9572B", c2: "#F3E6D8" },
    { cat: "cuisine", c1: "#1B1D1F", c2: "#D9C08E" }, { cat: "sol", c1: "#B0845A", c2: "#EEF0EA" }, { cat: "sdb", c1: "#5E7D6A", c2: "#F4F1EA" }
  ];
  var T = {
    fr: { kicker: "Artisan rénovation", h1: "On rénove, vous voyez la différence", lead: "Cuisines, salles de bains, peinture et sols : un seul interlocuteur, des délais tenus et une estimation avant même de nous appeler.",
      cta: "Estimer mes travaux", before: "Avant", after: "Après",
      e_k: "Estimation en ligne", e_h: "Une idée du budget en 20 secondes", e_p: "Choisissez les travaux, la surface et la finition : la fourchette s'affiche tout de suite. Le devis précis se fait après une visite gratuite.",
      q1: "Quels travaux ?", q2: "Quelle surface ?", q3: "Quelle finition ?", std: "Standard", prem: "Haut de gamme",
      types: { cuisine: "Cuisine", sdb: "Salle de bains", peinture: "Peinture", sol: "Sols" },
      r_k: "Estimation indicative", between: "entre", and: "et", r_note: "Démo : fourchettes inventées pour l'exemple.", r_go: "Demander un devis gratuit",
      incl: ["Visite et métré gratuits", "Devis détaillé sous 48 h", "Chantier protégé et nettoyé"], sent: "Démo : dans un vrai site, la demande arrive chez l'artisan avec l'estimation et les réponses du client.",
      g_k: "Réalisations", g_h: "Nos derniers chantiers", all: "Tous",
      reals: [["Cuisine vert sapin", "12 m² · 3 semaines"], ["Salle de bains à l'italienne", "6 m² · 2 semaines"], ["Séjour repeint", "28 m² · 4 jours"], ["Cuisine noire et laiton", "9 m² · 3 semaines"], ["Parquet chêne massif", "35 m² · 1 semaine"], ["Salle d'eau sous combles", "4 m² · 10 jours"]],
      foot: "Démonstration Devanture : entreprise, chantiers et prix inventés." },
    en: { kicker: "Renovation contractor", h1: "We renovate, you see the difference", lead: "Kitchens, bathrooms, painting and floors: one contact, deadlines kept, and an estimate before you even call us.",
      cta: "Estimate my project", before: "Before", after: "After",
      e_k: "Online estimate", e_h: "A budget idea in 20 seconds", e_p: "Pick the work, the area and the finish: the range shows up straight away. The exact quote follows a free visit.",
      q1: "What work?", q2: "What area?", q3: "What finish?", std: "Standard", prem: "High-end",
      types: { cuisine: "Kitchen", sdb: "Bathroom", peinture: "Painting", sol: "Floors" },
      r_k: "Indicative estimate", between: "between", and: "and", r_note: "Demo: price ranges made up for the example.", r_go: "Request a free quote",
      incl: ["Free visit and measurements", "Detailed quote within 48 hours", "Site protected and cleaned"], sent: "Demo: on a real site, the request reaches the contractor with the estimate and the customer's answers.",
      g_k: "Our work", g_h: "Recent projects", all: "All",
      reals: [["Fir-green kitchen", "12 m² · 3 weeks"], ["Walk-in shower bathroom", "6 m² · 2 weeks"], ["Repainted living room", "28 m² · 4 days"], ["Black and brass kitchen", "9 m² · 3 weeks"], ["Solid oak parquet", "35 m² · 1 week"], ["Attic shower room", "4 m² · 10 days"]],
      foot: "Devanture demo: company, projects and prices are made up." }
  };
  var lang = "fr", type = "cuisine", fin = "std", cat = "tout", timer;
  try { if (new URLSearchParams(location.search).get("lang") === "en") lang = "en"; } catch (e) {}
  var $ = function (s) { return document.querySelector(s); };
  var esc = function (s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;"); };
  var eur = function (n) { var v = Math.round(n / 50) * 50; var s = v.toLocaleString(lang === "fr" ? "fr-FR" : "en-GB"); return lang === "fr" ? s + " €" : "€" + s; };
  var vignette = function (r) {
    return '<svg viewBox="0 0 400 300" aria-hidden="true"><rect width="400" height="300" fill="' + r.c2 + '"/><rect y="200" width="400" height="100" fill="' + r.c1 + '" opacity=".35"/><rect x="40" y="130" width="320" height="80" fill="' + r.c1 + '"/><rect x="40" y="70" width="140" height="44" fill="' + r.c1 + '" opacity=".85"/><rect x="230" y="60" width="110" height="56" fill="#fff" stroke="' + r.c1 + '" stroke-width="4"/><path d="M110 0v40M290 0v26" stroke="#1B1D1F" stroke-width="2"/><circle cx="110" cy="46" r="8" fill="#1B1D1F"/></svg>';
  };
  function rendre() {
    if (nav) nav.setLang(lang);
    var t = T[lang];
    document.documentElement.lang = lang;
    document.querySelectorAll("[data-t]").forEach(function (el) { el.textContent = t[el.getAttribute("data-t")]; });
    document.querySelectorAll("[data-lang]").forEach(function (b) { b.setAttribute("aria-pressed", String(b.getAttribute("data-lang") === lang)); });
