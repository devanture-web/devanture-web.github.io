<meta name="robots" content="noindex, follow">

<link rel="icon" href="../../favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{--cream:#F7F1EC;--sand:#EFE4DB;--ink:#2B1F1D;--muted:#6E5D57;--rose:#B8645A;--rose-2:#9E4F46;--line:#E2D3C8}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--cream);color:var(--ink);font-family:Jost,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button,select{font:inherit;color:inherit}
.serif{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;letter-spacing:-.01em}
.wrap{width:min(1120px,100% - 40px);margin-inline:auto}
/* héro vidéo */
.hero{position:relative;min-height:100vh;min-height:100svh;display:flex;flex-direction:column;color:#FFF7F2;overflow:hidden;background:#1A1214 url("ambiance.jpg") center/cover}
.hero video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,12,14,.35),rgba(20,12,14,.15) 40%,rgba(20,12,14,.65))}
.hero>*{position:relative;z-index:1}
nav.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:22px 0}
.brand{display:flex;align-items:center;gap:10px;font-size:26px}
.brand i{width:38px;height:38px;border-radius:11px;background:#FFF7F2;display:grid;place-items:center}
.links{display:flex;align-items:center;gap:12px;font-size:15px}
.links a:hover{opacity:.75}
.lang{display:flex;border:1px solid rgba(255,247,242,.45);border-radius:999px;padding:3px}
.lang button{border:0;background:none;padding:6px 11px;border-radius:999px;font-size:12px;font-weight:600;cursor:pointer;color:#FFF7F2}
.lang button[aria-pressed="true"]{background:#FFF7F2;color:var(--ink)}
.hero-body{margin-block:auto;padding:40px 0 90px}
.hero-body>*{max-width:640px}
.kicker{font-size:13px;font-weight:600;letter-spacing:.24em;text-transform:uppercase}
.hero h1{font-size:clamp(48px,7vw,92px);line-height:.98;margin:18px 0 22px}
.hero p{font-size:19px;line-height:1.55;max-width:48ch;opacity:.92;margin:0 0 32px}
.btn{display:inline-flex;align-items:center;gap:10px;min-height:52px;padding:0 26px;border-radius:999px;border:0;background:var(--rose);color:#fff;font-weight:600;font-size:16px;cursor:pointer}
.btn:hover{background:var(--rose-2)}
.btn.ghost{background:transparent;border:1px solid rgba(255,247,242,.7);color:#FFF7F2;margin-left:10px}
.video-note{position:absolute;left:70px;bottom:24px;z-index:1;font-size:12px;opacity:.8}
.hero-body{position:relative}
.hero-photo{position:absolute;right:0;top:50%;transform:translateY(-50%);width:340px;max-width:none;margin:0;border-radius:22px;overflow:hidden;border:1px solid rgba(255,247,242,.4);box-shadow:0 30px 70px -25px rgba(0,0,0,.6);background:#EFE4DB}
.hero-photo img{display:block;width:100%;height:auto;aspect-ratio:3/2;object-fit:cover}
.hero-photo figcaption{padding:9px 13px;font-size:12px;background:rgba(20,12,14,.78);color:#FFF7F2}
.hero-photo figcaption a{text-decoration:underline;text-underline-offset:2px}
@media (max-width:1000px){.hero-photo{position:static;transform:none;width:100%;max-width:420px;margin-top:30px}}
.pause{position:absolute;left:20px;bottom:14px;z-index:2;width:40px;height:40px;border-radius:50%;border:1px solid rgba(255,247,242,.6);background:rgba(20,12,14,.35);color:#FFF7F2;display:grid;place-items:center;cursor:pointer}
section.part{padding:90px 0}
.part h2{font-size:clamp(36px,4.5vw,56px);margin:10px 0 14px}
.part .intro{color:var(--muted);font-size:17px;max-width:56ch;margin:0 0 44px;line-height:1.6}
.k-rose{color:var(--rose)}
.soins{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.soin{background:#fff;border:1px solid var(--line);border-radius:22px;padding:26px 22px;display:flex;flex-direction:column;gap:10px;transition:transform .2s ease,box-shadow .2s ease}
.soin:hover{transform:translateY(-4px);box-shadow:0 24px 50px -30px rgba(43,31,29,.45)}
.soin .ic{width:48px;height:48px;border-radius:14px;background:var(--sand);display:grid;place-items:center;color:var(--rose)}
.soin h3{font-size:28px;margin:6px 0 0}
.soin p{margin:0;color:var(--muted);font-size:15px;line-height:1.5;flex:1}
.soin .meta{display:flex;justify-content:space-between;align-items:baseline;padding-top:14px;border-top:1px solid var(--line);font-size:14px;color:var(--muted)}
.soin .meta b{font-family:"Cormorant Garamond",Georgia,serif;font-size:28px;color:var(--ink)}
.book{background:var(--sand)}
.book-grid{display:grid;grid-template-columns:1fr 1.1fr;gap:48px;align-items:start}
.form{background:#fff;border-radius:26px;padding:30px;border:1px solid var(--line);display:flex;flex-direction:column;gap:20px}
.form label{display:flex;flex-direction:column;gap:8px;font-size:14px;font-weight:600}
.form select{min-height:50px;border-radius:14px;border:1px solid var(--line);padding:0 14px;background:var(--cream)}
.days,.slots{display:flex;gap:8px;flex-wrap:wrap}
.days button,.slots button{min-height:46px;min-width:56px;padding:0 12px;border-radius:14px;border:1px solid var(--line);background:var(--cream);cursor:pointer;font-size:14px}
.days button span{display:block;font-size:11px;color:var(--muted)}
.days button[aria-pressed="true"],.slots button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.days button[aria-pressed="true"] span{color:#E8D9D0}
.slots button:disabled{opacity:.35;text-decoration:line-through;cursor:not-allowed}
.recap{display:flex;justify-content:space-between;align-items:center;gap:14px;padding-top:18px;border-top:1px solid var(--line);font-size:15px;color:var(--muted)}
.recap b{color:var(--ink)}
.hours{list-style:none;padding:0;margin:26px 0 0;display:flex;flex-direction:column;gap:10px;font-size:16px}
.hours li{display:flex;justify-content:space-between;border-bottom:1px dashed var(--line);padding-bottom:10px;max-width:420px}
footer{padding:40px 0;text-align:center;font-size:13px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;background:var(--ink);color:#fff;padding:14px 18px;border-radius:14px;font-size:14px;transition:.25s ease;max-width:92%;text-align:center;z-index:9}
.toast.on{opacity:1;transform:translateX(-50%)}
@media (max-width:980px){.soins{grid-template-columns:1fr 1fr}.book-grid{grid-template-columns:1fr}}
@media (max-width:620px){.soins{grid-template-columns:1fr}.btn.ghost{margin:12px 0 0}.hero p{font-size:17px}}
@media (prefers-reduced-motion:reduce){.hero video{display:none}html{scroll-behavior:auto}}
/* menu commun et sous-pages */
:root{--dn-hover:rgba(255,247,242,.16);--dn-panel:#FFFFFF;--dn-panel-text:#2B1F1D;--dn-hover-panel:#F7F1EC;--dn-accent:#B8645A;--dn-line:#E2D3C8;--dn-text:#2B1F1D;--dn-muted:#6E5D57;--dn-card:#FFFFFF;--dn-top:84px}
.hero>.nav-wrap{z-index:6} /* le menu déroulant passe devant la photo */
.dn-sous-page .hero{min-height:0}
.dn-sous-page .hero-body,.dn-sous-page .pause,.dn-sous-page .video-note{display:none}
.dn-burger{border-color:rgba(255,247,242,.5)}
.soin .dn-photo{margin:-26px -22px 6px;aspect-ratio:4/3;border-radius:22px 22px 0 0;border-width:0 0 1.5px}
html,body{overflow-x:clip}
