<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Boutique en ligne (démo) | Devanture</title>
<!-- Démo fictive des exemples Devanture : pas indexée ; produits et prix inventés ; aucun paiement réel. -->
<meta name="robots" content="noindex, follow">
<meta name="theme-color" content="#F3EEE6">
<link rel="icon" href="../../favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&amp;family=DM+Sans:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
:root{--bg:#F3EEE6;--card:#FFFDF9;--ink:#1F1B16;--muted:#6B6258;--line:#E3DACD;--green:#2F5D50;--green-2:#244A40;--clay:#C4703F}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"DM Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer}
.serif{font-family:"DM Serif Display",Georgia,serif;font-weight:400}
.wrap{width:min(1160px,100% - 40px);margin-inline:auto}
header{position:sticky;top:0;z-index:5;background:rgba(243,238,230,.97);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:16px;height:68px}
.brand{display:flex;align-items:center;gap:10px;font-size:24px}
.brand i{width:36px;height:36px;border-radius:10px;background:var(--green);display:grid;place-items:center}
.right{display:flex;align-items:center;gap:10px}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;padding:3px}
.lang button{border:0;background:none;padding:6px 11px;border-radius:999px;font-size:12px;font-weight:700}
.lang button[aria-pressed="true"]{background:var(--ink);color:#fff}
.cart-btn{position:relative;display:flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;border-radius:999px;border:0;background:var(--green);color:#fff;font-weight:700}
.cart-btn .n{min-width:22px;height:22px;border-radius:999px;background:#fff;color:var(--green);display:grid;place-items:center;font-size:12px;padding:0 6px}
.cart-btn.bump{animation:bump .35s ease}
@keyframes bump{50%{transform:scale(1.08)}}
.hero{padding:64px 0 36px;display:grid;grid-template-columns:1.2fr .8fr;gap:40px;align-items:end}
.hero h1{font-size:clamp(42px,5.6vw,72px);line-height:1;margin:14px 0 18px}
.hero p{color:var(--muted);font-size:18px;line-height:1.55;margin:0;max-width:50ch}
.kicker{font-size:12.5px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--clay)}
.promise{display:flex;flex-direction:column;gap:10px}
.promise span{display:flex;align-items:center;gap:10px;padding:12px 16px;border-radius:14px;background:var(--card);border:1px solid var(--line);font-size:14.5px}
.tools{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;padding:18px 0 26px;border-top:1px solid var(--line)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{min-height:42px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:14px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
select{min-height:42px;border-radius:12px;border:1px solid var(--line);background:var(--card);padding:0 12px;font:inherit}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;padding-bottom:80px}
.p{background:var(--card);border:1px solid var(--line);border-radius:22px;overflow:hidden;display:flex;flex-direction:column;transition:transform .2s ease,box-shadow .2s ease}
.p:hover{transform:translateY(-4px);box-shadow:0 26px 50px -32px rgba(31,27,22,.5)}
.p .img{height:220px;display:grid;place-items:center}
.p .img{height:250px}
.p .img svg{width:150px;height:218px}
.p .body{padding:20px;display:flex;flex-direction:column;gap:8px;flex:1}
.p h3{font-size:26px;margin:0}
.p .notes{color:var(--muted);font-size:14.5px;line-height:1.45;margin:0;flex:1}
.intens{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.intens i{width:18px;height:5px;border-radius:3px;background:var(--line)}
.intens i.on{background:var(--clay)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:8px}
.price{font-family:"DM Serif Display",Georgia,serif;font-size:26px}
.price small{font-family:"DM Sans",sans-serif;font-size:12px;color:var(--muted)}
.grind{display:flex;border:1px solid var(--line);border-radius:999px;padding:3px;font-size:12px}
.grind button{border:0;background:none;padding:6px 10px;border-radius:999px}
.grind button[aria-pressed="true"]{background:var(--bg);font-weight:700}
.add{min-height:46px;border-radius:999px;border:0;background:var(--green);color:#fff;font-weight:700;margin-top:6px}
.add:hover{background:var(--green-2)}
/* panier */
.shade{position:fixed;inset:0;background:rgba(31,27,22,.35);opacity:0;pointer-events:none;transition:opacity .2s ease;z-index:8}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(420px,100%);background:var(--card);z-index:9;transform:translateX(100%);transition:transform .28s cubic-bezier(.22,1,.36,1);display:flex;flex-direction:column}
body.open .shade{opacity:1;pointer-events:auto}
body.open .drawer{transform:none}
.d-head{display:flex;justify-content:space-between;align-items:center;padding:20px 22px;border-bottom:1px solid var(--line)}
.d-head h2{margin:0;font-size:28px}
.close{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:none;font-size:20px}
.ship{padding:16px 22px;border-bottom:1px solid var(--line);font-size:14px}
.ship .track{height:8px;border-radius:999px;background:var(--bg);margin-top:10px;overflow:hidden}
.ship .track i{display:block;height:100%;background:var(--green);border-radius:inherit;transition:width .3s ease}
.lines{flex:1;overflow:auto;padding:8px 22px}
.line{display:grid;grid-template-columns:52px 1fr auto;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.line .mini{width:52px;height:64px;border-radius:12px;display:grid;place-items:center}
.line .mini svg{width:34px;height:50px}
.line b{display:block;font-size:15px}
.line small{color:var(--muted);font-size:12.5px}
.qty{display:flex;align-items:center;gap:6px}
.qty button{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:none}
.empty{color:var(--muted);text-align:center;padding:40px 0}
.d-foot{padding:20px 22px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:12px}
.total{display:flex;justify-content:space-between;font-size:18px}
.total b{font-family:"DM Serif Display",Georgia,serif;font-size:26px}
.pay{min-height:54px;border-radius:999px;border:0;background:var(--ink);color:#fff;font-weight:700;font-size:16px}
footer{padding:30px 0 50px;text-align:center;color:var(--muted);font-size:13px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;background:var(--ink);color:#fff;padding:14px 18px;border-radius:14px;font-size:14px;transition:.25s ease;max-width:92%;text-align:center;z-index:20}
.toast.on{opacity:1;transform:translateX(-50%)}
@media (max-width:960px){.grid{grid-template-columns:1fr 1fr}.hero{grid-template-columns:1fr}}
@media (max-width:620px){.grid{grid-template-columns:1fr}.cart-btn .lbl{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
/* menu commun et sous-pages */
:root{--dn-hover:rgba(31,27,22,.06);--dn-panel:#FFFDF9;--dn-panel-text:#1F1B16;--dn-hover-panel:#F3EEE6;--dn-accent:#2F5D50;--dn-line:#E3DACD;--dn-text:#1F1B16;--dn-muted:#6B6258;--dn-card:#FFFDF9;--dn-top:68px}
#grid{scroll-margin-top:170px}
.bar{gap:10px}
.dn-wrap{margin-left:auto;margin-right:6px}
#heroPh .dn-photo{aspect-ratio:16/9;background:var(--card)}
html,body{overflow-x:clip}
@media (max-width:560px){.brand{font-size:18px;gap:8px}.brand i{width:32px;height:32px}.bar{gap:6px}.right{gap:6px}.lang button{padding:5px 8px}.cart-btn{padding:0 12px;gap:6px}}
@media (max-width:380px){.brand{font-size:16px}.lang{display:none}}

    var nom = p[lang][0], taille = nom.length > 12 ? 15 : nom.length > 8 ? 19 : 22;
    var points = [1, 2, 3].map(function (k) { return '<circle cx="' + (86 + k * 9) + '" cy="206" r="3.2" fill="' + (k <= p.i ? "#2A241D" : "none") + '" stroke="#2A241D" stroke-width="1.2"/>'; }).join("");
    var dents = ""; for (var x = 36; x <= 164; x += 8) dents += "M" + x + " 22v22";
    return '<svg viewBox="0 0 200 290" aria-hidden="true"><defs>' +
